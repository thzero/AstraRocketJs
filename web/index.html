<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- iOS ignores the web app manifest's icons and uses this instead. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>AstraRocketJs</title>
    <script>
      /* The saved theme on <html> before the first paint, so a light user never
         sees a dark frame. Mirrors services/app/theme.ts applyTheme and the
         settings key (services/storage/settings.ts); main.tsx applies it again
         once the modules load, so a stale copy here costs one frame, not more. */
      try {
        var pref = JSON.parse(localStorage.getItem('astrarocketjs:settings:v1') || '{}').theme;
        if (pref === 'system') pref = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (pref === 'light' || pref === 'daylight') document.documentElement.setAttribute('data-theme', pref);
      } catch (e) {}
    </script>
    <style>
      /* Instant paint before any JS: dark background (no white flash) plus a
         wordmark, so the first frame is not an empty page while the app's own
         bundle parses. React replaces it the moment it renders, which is now as
         soon as the modules evaluate — the engine loads BEHIND the app (see
         main.tsx), so nothing here waits on a 2.3 MB download any more, and the
         bar sweeps rather than reporting a figure nothing updates. Progress and
         failure are the app's job now: components/layout/EngineNotice.tsx. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #e2e8f0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      /* The light themes' splash: the same layout on their canvas. */
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f1f5f9;
      }
      html[data-theme='daylight'],
      html[data-theme='daylight'] body {
        background: #ffffff;
      }
      html[data-theme='light'] #boot,
      html[data-theme='daylight'] #boot {
        color: #0f172a;
      }
      html[data-theme='light'] #boot .wm,
      html[data-theme='daylight'] #boot .wm {
        color: #1e293b;
      }
      html[data-theme='light'] #boot .cap,
      html[data-theme='daylight'] #boot .cap {
        color: #475569;
      }
      #boot .rk {
        font-size: 52px;
        line-height: 1;
        animation: boot-float 2.4s ease-in-out infinite;
      }
      #boot .wm {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: #cbd5e1;
      }
      #boot .sp {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #38bdf8;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot .cap {
        font-size: 14px;
        color: #94a3b8;
        min-height: 20px;
        font-variant-numeric: tabular-nums;
      }
      /* Determinate while the engine reports bytes; the .indeterminate sweep
         takes over when the host declares no content-length. */
      #boot .bar {
        width: min(280px, 72vw);
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.25);
      }
      #boot .bar > i {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #38bdf8;
        transition: width 0.18s linear;
      }
      #boot .bar.indeterminate > i {
        width: 40%;
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .rk,
        #boot .sp,
        #boot .bar.indeterminate > i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="rk">🚀</div>
        <div class="wm">AstraRocketJs</div>
        <div class="sp"></div>
        <div class="bar indeterminate"><i></i></div>
        <!-- English, and the only string here that cannot be translated: i18n is
             not loaded at first paint. It is on screen for as long as the app's
             own bundle takes to evaluate, and says "starting" rather than naming
             the engine, which no longer gates this. -->
        <div class="cap">Starting…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
