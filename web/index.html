<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>AstraRocketJs</title>
    <style>
      /* Instant paint before any JS: dark background (no white flash) + a boot
         splash shown while the lazy physics engine (WASM-GC, ~2.3 MB, or the JS
         fallback) fetches and compiles. main.tsx awaits initEngine() before it
         mounts React, so #root stays empty until then — React replaces this
         splash the moment it renders. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #e2e8f0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      #boot .rk {
        font-size: 52px;
        line-height: 1;
        animation: boot-float 2.4s ease-in-out infinite;
      }
      #boot .wm {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: #cbd5e1;
      }
      #boot .sp {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #38bdf8;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot .cap {
        font-size: 14px;
        color: #94a3b8;
        min-height: 20px;
        font-variant-numeric: tabular-nums;
      }
      /* Determinate while the engine reports bytes; the .indeterminate sweep
         takes over when the host declares no content-length. */
      #boot .bar {
        width: min(280px, 72vw);
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.25);
      }
      #boot .bar > i {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #38bdf8;
        transition: width 0.18s linear;
      }
      #boot .bar.indeterminate > i {
        width: 40%;
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .rk,
        #boot .sp,
        #boot .bar.indeterminate > i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="rk">🚀</div>
        <div class="wm">AstraRocketJs</div>
        <div class="sp"></div>
        <div class="bar indeterminate" id="boot-bar"><i></i></div>
        <!-- English until main.tsx runs: i18n is not loaded yet at first paint.
             bootSplash.ts replaces this with translated, per-phase text. -->
        <div class="cap" id="boot-cap">Loading engine…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
