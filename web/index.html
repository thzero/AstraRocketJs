<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>AstraRocketJs</title>
    <style>
      /* Instant paint before any JS: dark background (no white flash) + a boot
         splash shown while the lazy physics engine (WASM-GC, ~2.3 MB, or the JS
         fallback) fetches and compiles. main.tsx awaits initEngine() before it
         mounts React, so #root stays empty until then — React replaces this
         splash the moment it renders. */
      html, body { margin: 0; height: 100%; background: #0b1020; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        color: #e2e8f0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #boot .rk { font-size: 40px; line-height: 1; animation: boot-float 2.4s ease-in-out infinite; }
      #boot .wm { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; color: #cbd5e1; }
      #boot .sp {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(148, 163, 184, 0.25); border-top-color: #38bdf8;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot .cap { font-size: 11px; color: #64748b; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .rk, #boot .sp { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="rk">🚀</div>
        <div class="wm">AstraRocketJs</div>
        <div class="sp"></div>
        <div class="cap">Loading engine…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
