name: Deploy

# The master pipeline: the full gate set, then the Pages publish.
#
# The gates are the SAME jobs a PR runs — gates.yml, called from both here and
# ci.yml. They are not duplicated: GitHub has no cross-workflow ordering, so
# "run ci.yml first, then deploy" is not expressible between two files, but a
# reusable workflow (`workflow_call`) shares the job definitions without needing
# it. Nothing publishes until every one of them is green.
#
# ci.yml is `pull_request`-only and this file is master-push-only, so the two
# never fire on the same event.
#
# Publishes web/dist to GitHub Pages.
# ONE-TIME SETUP: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege token for the deploy; allow one concurrent Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            website/package-lock.json

      - run: npm ci

      # Refresh the About dialog's contributor list from the GitHub API so a newly
      # merged contributor is credited on the next deploy without a manual commit.
      # Best-effort: if the API is down or throttled the step is skipped and the
      # build uses the committed src/data/contributors.generated.json instead.
      - id: contributors
        run: npm run sync:contributors
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # continue-on-error hides the difference between "the API was throttled
      # today" and "this has been broken for months" -- and nothing else ever
      # runs this script, so the About dialog's contributor list would just
      # quietly freeze. Say so, the way sync-catalogs.yml already does.
      - if: steps.contributors.outcome == 'failure'
        run: |
          echo "::warning title=Contributor sync failed::Deployed with the committed contributors.generated.json. If this repeats it is broken, not throttled."
          echo "### Contributor sync failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed with the committed src/data/contributors.generated.json." >> "$GITHUB_STEP_SUMMARY"

      # Docs are built BEFORE the app and into web/public, so the service worker
      # precaches them: Help has to work offline, which is much of the point of
      # the PWA. public/ is copied verbatim into dist by Vite.
      - name: Install docs deps
        working-directory: website
        run: npm ci

      # The docs gate lives HERE, not in gates.yml: the Docusaurus site is not
      # built on a PR at all. This typecheck is part of that gate — without
      # it, website/'s `typecheck` script would be run by nothing again.
      - name: Typecheck docs
        working-directory: website
        run: npm run typecheck

      - name: Build docs into the app
        working-directory: website
        run: npx docusaurus build --out-dir "$GITHUB_WORKSPACE/web/public/docs"
        env:
          DOCS_BASE_URL: /${{ github.event.repository.name }}/docs/
      # Serve from https://<user>.github.io/<repo>/ — base must be /<repo>/.
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          # Read the motor/component catalogs from the separately published `data`
          # branch (see sync-catalogs.yml) instead of the copy inside this build, so
          # a catalog refresh goes live without a deploy. The in-build copy stays as
          # the fallback for when the CDN is unreachable.
          #
          # Safe before the `data` branch exists: jsDelivr 404s a missing branch in
          # ~0.4s (measured — as fast as it serves a real file), and the catalogs are
          # fetched when a picker first opens, not at page load. So until the first
          # sync runs this costs ~0.4s on first open and then falls back.
          VITE_DATA_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@data/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
