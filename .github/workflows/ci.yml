name: CI

# Fast feedback on every PR and on pushes to non-deploy branches: typecheck,
# lint, unit tests, and a production build. `npm run build` already runs
# `tsc --noEmit && eslint . --max-warnings 0 && vite build`, so these two steps
# are the same gates as the deploy — minus the publish (deploy-pages.yml still
# guards the actual master deploy).
on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run test

      - run: npm run build
