name: CI

# The PR gate. Triggered by `pull_request` ONLY — opening a PR, and every push
# to a branch that has one open. There is deliberately no `push` trigger: work
# on a branch with no PR is not gated here, and master is handled by deploy.yml.
# One trigger means no double-firing, which is why this file no longer needs the
# `guard` job it used to carry.
#
# A `pull_request` run tests the MERGE of head into base, not the branch tip.
#
# WHAT runs is in gates.yml, shared with deploy.yml so master cannot drift from
# what a PR was held to. Add a gate there, not here.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
