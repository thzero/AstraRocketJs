name: CI

# Every gate for a PR, in ONE file. The engine jobs used to live in a separate
# engine.yml, which could not work: GitHub has no cross-workflow ordering, so
# two workflows on the same event race rather than sequence. The engine gate has
# to come FIRST — every app test below runs against the COMMITTED engine
# binaries, so if those are stale or divergent from src/java, a green unit suite
# and a green e2e run are both measuring the wrong engine. Merged here, `needs:`
# expresses that ordering and GitHub honors it.
#
# Order: (parity, reproducible) → (build-and-test, e2e).
#
# `npm run build` already runs `tsc --noEmit && eslint . --max-warnings 0
# && vite build`, so these steps are the same gates as the deploy — minus the
# publish (deploy.yml re-runs every one of these on master, then publishes).
#
# Triggered by `pull_request` ONLY — opening a PR, and every push to a branch
# that has one open. There is deliberately no `push` trigger: work on a branch
# with no PR is not gated here, and master is handled by deploy.yml.
#
# This also removes the need for the `guard` job this file used to carry. With
# both triggers, a push to a branch with an open PR fired BOTH events and every
# job ran twice on the same commit; the concurrency groups could not collapse
# them (a push is keyed `refs/heads/dev`, a PR `refs/pull/N/merge`), so a job
# had to ask the API whether a PR already covered the SHA. One trigger, no
# overlap, no guard.
#
# A `pull_request` run tests the MERGE of head into base, not the branch tip.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    # The Gradle daemon is disabled for CI inside parity.mjs / build-engine.mjs
    # (`--no-daemon` when process.env.CI), NOT here. It has to be on the command
    # line: GRADLE_OPTS is the LOWEST-precedence way to set org.gradle.daemon and
    # engine-java/gradle.properties (daemon=true) overrides it. Setting it here
    # was tried and the step still hung. See the note in those scripts.
    # A backstop, not a budget. This job still runs four TeaVM builds - parity
    # builds -Pparity for JS and for WASM-GC, then the committed-engine check
    # builds both targets again - plus a cold Gradle cache save. It no longer
    # runs the JVM reference twice (see the parity step below). The cap has to
    # clear all of that on a cold cache with room to spare; 25 did not, and
    # cancelled a job that was working.
    #
    # This cap is NOT the hang protection it once claimed to be. parity.mjs
    # exiting explicitly fixed one hang (node's own event loop); the Gradle
    # daemon then caused another, and at 60 minutes this cap would have let a
    # passing check hold a runner for an hour. GRADLE_OPTS above is the actual
    # fix. The cap is only a backstop against something new.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine-java
    steps:
      - uses: actions/checkout@v4

      # 21 is the toolchain build.gradle pins. TeaVM compiles the bytecode
      # rather than running it, so the level only has to satisfy both ends.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      # No `npm ci` above, deliberately: engine-java/package.json declares no
      # dependencies. It exists only to name these entry points, so `npm run`
      # works here with nothing installed and CI says what the docs say.
      #
      # parity.mjs is self-contained: it builds the parity engine variant
      # (-Pparity) and the JVM reference itself, then requires bit-identical
      # output modulo a small ULP tolerance on transcendentals.
      #
      # Both targets in one step, which is now the script's default: the JVM
      # reference is the expensive half and does not depend on the TeaVM target.
      # As two steps this computed the identical reference twice and threw one
      # away: measured warm, the two separate runs were 19s + 11s against 10s
      # for the single run. Each target is still reported on its own line
      # ("parity ok [js]" / "[wasm]"), so a divergence still says which one
      # diverged. `npm run parity:js` / `:wasm` narrow it when bisecting one
      # backend.
      - name: Parity — JVM vs TeaVM-JS and WASM-GC
        run: npm run parity

      # Were the COMMITTED binaries actually built from this source?
      #
      # Parity above proves JS == WASM == JVM, all built fresh from src/java —
      # it never reads the two files the app ships, so editing the Java and
      # forgetting `build-engine.mjs` left CI green while the app ran the old
      # physics. Hand-editing a vendor file was equally invisible.
      #
      # Rebuild over the committed artifacts and let git decide: TeaVM output is
      # byte-deterministic here (verified by building twice), so an unchanged
      # source rewrites identical bytes and `git diff` stays empty. Stale
      # binaries AND hand-edited binaries both show up as a diff.
      #
      # If this ever proves flaky across OS/JDK rather than catching a real
      # staleness, the fallback is a source+artifact SHA-256 stamp written by
      # build-engine.mjs and compared here instead — cheaper, but it cannot
      # catch a hand-edited binary.
      - name: The committed engine matches src/java
        run: |
          npm run build
          git diff --exit-code --             ../web/src/engine/vendor/openrocket-engine.mjs             ../web/public/engine/openrocket-engine.wasm             ../web/public/engine/openrocket-engine.wasm-runtime.js

  # Can src/java still be REGENERATED from its declared inputs? Parity above
  # cannot answer that — it builds from src/java and compares the two TeaVM
  # targets, so it is blind to src/java having drifted from upstream(+patches).
  # It had: a regeneration produced a tree that did not compile, and the one
  # tool that checks could not fail (its exit code ignored drift entirely).
  #
  # Needs no JDK — just node and the pinned OpenRocket source.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned in engine-java/extract/UPSTREAM. --check is only meaningful
      # against the exact tree the extraction was made from; a floating ref
      # would report every upstream commit as drift.
      - name: Check out the pinned OpenRocket source
        uses: actions/checkout@v4
        with:
          repository: thzero/openrocket
          ref: c1a1a9b9fff2d629a5a64dc30dfd0603dfef62c3
          path: .openrocket-src
          sparse-checkout: core/src/main/java
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extraction is reproducible
        working-directory: engine-java
        run: npm run extract:check -- --src "$GITHUB_WORKSPACE/.openrocket-src"

  # Gated on the engine jobs: see the ordering note at the top of this file.
  build-and-test:
    needs: [parity, reproducible]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Formatting, gated at last. It could not be turned on before: with no
      # .gitattributes, a CRLF checkout failed `--check` on every tracked file,
      # so the signal was 100% noise. `.gitattributes` pins LF and
      # `.prettierignore` excludes the generated artifacts (public/docs, the
      # TeaVM output, the synced catalogs), which leaves only authored code.
      - run: npm run format:check

      # US English, enforced. The tree had ~380 British spellings in comments,
      # UI strings and docs before this ran; cspell's en-US dictionary catches a
      # new one, and cspell.json's flagWords make the common ones (colour,
      # centre, metre, -ise) forbidden outright, so no project-words entry can
      # quietly let one back in.
      - run: npm run spell

      # Coverage is REPORTED, not enforced. The baseline at the time it was
      # added was 46% statements / 47% lines across ~200 modules; a threshold
      # picked before anyone has read that is a number to game, not a gate.
      - run: npm run test:coverage

      - run: npm run build

      # Dead exports / unimported modules. Cheap, and it only stays useful if
      # something runs it.
      - run: npm run knip

  # NOTE: the Docusaurus site is NOT built here. It is gated in deploy.yml
  # on merge to master, where it is built into web/public/docs anyway. The
  # trade-off is deliberate and it is real: a broken docusaurus.config.ts,
  # sidebars.ts or MDX page is no longer caught before merge, so it surfaces as
  # a RED MASTER DEPLOY rather than a red PR check, and the fix goes forward on
  # master. Accepted because docs breakage does not ship bad physics or a broken
  # app, and a PR touching only web/ paid a full `npm ci` + Docusaurus build for
  # a risk it could not introduce.

  # The integration layer: schematic, motor picker, recovery, mobile layout, the
  # aero tables. It was previously run only when someone remembered to, which is
  # how a shipped dialog reached master with an unbounded render loop in it.
  # Separate job so a Playwright failure is legible on its own and the browser
  # download does not slow the unit gate.
  e2e:
    needs: [parity, reproducible]
    runs-on: ubuntu-latest
    # Sharded because the suite is ~3.6 min of WALL CLOCK that no amount of
    # caching touches — the browser download the cache below removes is ~90s of
    # a ~4.4 min job, and the tests are the rest.
    #
    # Sharding rather than raising `workers`: playwright.config.ts pins
    # `workers: 1` on purpose (16 workers against ONE dev server, each
    # software-rendering WebGL and loading the 2.9 MB WASM engine, gave 45 then
    # 19 spurious failures and was SLOWER — 4.4 min vs 3.6). Each shard is its
    # own runner with its own dev server and its own single worker, so that
    # reasoning still holds and the contention never happens.
    #
    # Three ways: 90 tests over 21 files, so ~30 tests a shard. Each shard pays
    # its own ~50s of npm ci + browser restore + dev-server start, so the
    # returns flatten fast past this — four would buy ~20s more for another
    # runner's worth of minutes.
    strategy:
      # One shard failing must not cancel the others, or the first red shard
      # hides every other failure and you find them one push at a time.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Key the browser cache on the resolved Playwright version, not on the
      # lockfile hash: the browser build only changes when Playwright does, so
      # hashing the lockfile would throw away a good 130 MB download on every
      # unrelated dependency bump.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Chromium only: playwright.config.ts declares the one project, and it
      # already starts the dev server and sets retries/reporter under CI.
      #
      # Split on the cache: the browser itself lives in ~/.cache/ms-playwright
      # and restores, but `--with-deps` also apt-installs system libraries that
      # do NOT, so a cache hit still needs `install-deps` on its own.
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Artifact names must be unique across a matrix, or the shards
          # collide and only one report survives.
          name: playwright-report-shard-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7
