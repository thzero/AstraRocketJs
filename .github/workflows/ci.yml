name: CI

# Gate every PR (and non-master push) on typecheck + lint + tests, so problems
# surface before they reach master — deploy-pages.yml only runs on master push.
on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Dead-code gate: the tree is clean, so any new unused export/dep fails CI.
      - run: npm run knip
      - run: npm run test
