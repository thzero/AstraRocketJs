name: Dev

# The push gate for day-to-day work on EVERY branch but master.
#
# ci.yml is `pull_request`-only and deploy.yml is master-push-only, so without
# this a push with no PR open is checked by nothing until someone opens the PR.
#
# `branches-ignore: [master]` rather than a list of branch names: work on a
# `test`, a `fix/...` or a `spike/...` branch needs the gate as much as `dev`
# does, and a named list leaves every unnamed branch unchecked.
#
# master is excluded because deploy.yml already runs the full gate set there,
# and a branch with a PR open deliberately runs both this and ci.yml: two
# minutes of duplicate web checks is worth not having to reason about which
# branches have PRs.
#
# Tag pushes do not trigger this: a branch filter of either kind confines the
# `push` event to branches.
#
# Only the web gates: `npm run gates` (the one shared list in web/package.json,
# the same list a developer runs locally through `verify`) plus the unit suite,
# so the two cannot drift. No Java toolchain, no parity (20-60 min) and no e2e
# (~4 min sharded) - those stay in gates.yml, which the PR still has to pass.
#
# `verify:ci` rather than `verify`: both are `gates` plus the suite, but this one
# runs the suite WITH coverage so the floors in vitest.config.ts are enforced on every push rather
# than only on a PR. That is the expensive half - about 335 s against 65 s - which
# is exactly why it lives here and not in `verify`, the command a developer types
# before pushing.
#
# Cancels the previous run on the same ref: a second push while the first is
# still installing makes the first run's verdict about a commit nobody will
# look at.

on:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

# The name stays `Dev` because branch protection requires `Dev / verify`. The
# check GitHub reports is "<workflow name> / <job id>", so renaming the workflow
# silently breaks that rule. Rename it together with the protection settings,
# not before.

jobs:
  verify:
    runs-on: ubuntu-latest
    # `verify:ci` plus `npm ci` is about 6 min, so 10 would leave under a third
    # of the budget spare. A backstop only: if it is still going at fifteen
    # minutes something is hung, not slow.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run verify:ci
