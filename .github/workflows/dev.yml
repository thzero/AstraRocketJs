name: Dev

# The push gate for day-to-day work on EVERY branch but master.
#
# ci.yml is `pull_request`-only and deploy.yml is master-push-only, so without
# this a push with no PR open is checked by nothing until someone opens the PR.
#
# `branches-ignore: [master]` rather than a list of branch names: work on a
# `test`, a `fix/...` or a `spike/...` branch needs the gate as much as `dev`
# does, and a named list leaves every unnamed branch unchecked.
#
# master is excluded because deploy.yml already runs the full gate set there.
# A branch with a PR open runs both this and ci.yml.
#
# Tag pushes do not trigger this: a branch filter of either kind confines the
# `push` event to branches.
#
# The gate set from gates.yml, the same jobs a PR and master run, so a push
# finds an e2e failure before the PR does. Parity is left to the PR and master.
# golden-report skips itself here: it compares against a PR's base branch, and
# a push has none.
#
# Cancels the previous run on the same ref: a second push while the first is
# still running makes the first run's verdict about a commit nobody will look
# at.

on:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      parity: false

  # Branch protection requires `Dev / verify`. The check GitHub reports is
  # "<workflow name> / <job id>", so renaming the workflow or this job silently
  # breaks that rule. Change it together with the protection settings.
  #
  # `always()` and an explicit result check: a job skipped because a job it
  # needs failed reports as skipped, and a skipped required check counts as
  # passing.
  verify:
    needs: gates
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.gates.result != 'success'
        run: |
          echo "::error::A gate did not pass: ${{ needs.gates.result }}"
          exit 1
      - run: echo "Every gate passed."
