name: E2E (full)

# The whole Playwright suite, run by hand from the Actions tab. Pull requests and pushes
# to branches other than master and beta run only the core specs (the `e2e` job in gates.yml); this covers
# the rest: Help, the aero tables, maps, library, exports, motor import and
# the other feature specs, and update-flow: the service worker's update path and
# the app offline. Run it before a release or after a change to one of those
# features.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium and its system libraries come baked into the image. The tag must
    # match @playwright/test in web/package-lock.json; the check step fails when
    # they differ.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      # One shard failing must not cancel the other, or the first red shard
      # hides the rest of the failures.
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          # The website lock too: the Help spec needs the docs built.
          cache-dependency-path: |
            web/package-lock.json
            website/package-lock.json

      - run: npm ci

      - name: Install the docs site's dependencies
        working-directory: website
        run: npm ci

      # The in-app Help dialog reads web/public/docs, which is gitignored.
      # help-dialog.spec.ts fails in CI when the docs are missing, so this step
      # cannot be dropped without the run going red.
      - name: Build the docs the Help dialog reads
        run: npm run docs:build

      - name: Check the image matches Playwright
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          [ "$v" = "1.63.0" ] || { echo "::error::@playwright/test is $v; update the container image tag in e2e-full.yml"; exit 1; }

      - run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7

  update-flow:
    # The service worker, against real production builds: the update path, and
    # the runtime catalogs and the Help pages with the network off.
    #
    # Nothing else here can see any of these: the Playwright suite serves one
    # build, so it never sees a deploy, and vitest has no browser. The update check
    # proves what a deploy depends on: a tab open on the old build is offered
    # the new one and, on Reload, comes back on it, with no hard reload. The
    # offline-data check proves what a launch site depends on, in both catalog
    # layouts. With no data host the catalogs are precached and requested with
    # a `?v=<hash>` cache-buster, which Workbox does not strip when matching the
    # precache, so a wrong precache entry leaves motors, components and
    # materials unreachable offline with no error shown. With a data host, as
    # the deploy builds it, motors and components exist offline only in the
    # runtime cache, which the app writes itself on the first visit because the
    # worker does not control that page yet. Six `vite build`s (three for
    # the update flow, two for offline data, one for offline help) plus a
    # headless Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and its system libraries come baked into the image. The tag must
    # match @playwright/test in web/package-lock.json; the check step fails when
    # they differ.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # node_modules from the cache; `npm ci` only when the lockfile changed.
      - id: web-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: web-modules-${{ runner.os }}-node24-${{ hashFiles('web/package-lock.json') }}

      - if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      # The docs site's, the same way: this job builds the docs (below), which
      # runs Docusaurus out of website/.
      - id: website-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules
          key: website-modules-${{ runner.os }}-node24-${{ hashFiles('website/package-lock.json') }}

      - name: Install the docs site's dependencies
        if: steps.website-modules.outputs.cache-hit != 'true'
        working-directory: website
        run: npm ci

      # offline-help (the last step) needs the built docs: the in-app Help
      # dialog reads web/public/docs, which is gitignored, and the check serves
      # a production build with those docs precached. Both locales, as the
      # deploy builds them, because the dialog can be opened in either.
      - name: Build the docs the offline-help check reads
        run: npm run docs:build

      - name: Check the image matches Playwright
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          [ "$v" = "1.63.0" ] || { echo "::error::@playwright/test is $v; update the container image tag in e2e-full.yml"; exit 1; }

      - run: npm run e2e:update

      - run: npm run e2e:offline-data

      # Help with the network off, which is the case the docs are built INTO the
      # app for: a launch site with no signal. It is the one promise the
      # precached docs make, checked beside its sibling (offline DATA).
      - run: npm run e2e:offline-help
