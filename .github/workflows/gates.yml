name: Gates

# The gate set, called by ci.yml (on a PR) and dev.yml (on a push to any other
# branch). One definition, two callers: a
# reusable workflow (`workflow_call`) is how GitHub shares jobs, and it is the
# only way to avoid keeping copies of this in sync by hand.
#
# The web jobs (build-and-test, e2e, update-flow) run in parallel, and the PR
# is gated on all of them. The engine checks (parity, the reproducible extract,
# the aero scorecards) are not here: they only move when the engine changes,
# and are run by hand with `npm run audit` in engine-java.
#
# Callers decide WHEN this runs; this file only says WHAT runs. It has no
# trigger of its own and cannot be run directly.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # npm ci plus `verify` runs a few minutes. A cap sized just over the work
    # fails on runner load, which a shared runner has.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # ONE list, `gates` in web/package.json, run here and locally, so the
      # gates cannot drift between them. `verify` and
      # `verify:ci` are two endings on it: a gate added to `verify:ci` alone is
      # not run by CI. Spelling the steps out here instead lets the hand-run
      # list drift from this one. What the list holds, and why each is there:
      #
      #   format:check  Formatting. `.gitattributes` pins LF, without which a
      #                 CRLF checkout fails `--check` on every tracked file, and
      #                 `.prettierignore` excludes the generated artifacts
      #                 (public/docs, the TeaVM output, the synced catalogs),
      #                 leaving only authored code.
      #   spell         US English, enforced. cspell's en-US dictionary catches
      #                 a British spelling, and cspell.json's flagWords make the
      #                 common ones (the -our, -re and -ise forms) forbidden
      #                 outright, so no project-words entry can let one in.
      #   typecheck     All four tsconfig projects: src and tests, the app,
      #                 e2e, and the build config files (tsconfig.node.json).
      #   lint          ESLint, warnings included.
      #   knip          Dead exports / unimported modules. Cheap, and it only
      #                 stays useful if something runs it.
      #   dupes         jscpd over src (`.jscpd.json`): any copied block of 45
      #                 tokens and 5 lines fails, so two copies of a helper
      #                 cannot drift apart.
      #   vite build    The production build. Before the suite on purpose: it is
      #                 ~20 s against the suite's ~5 min, so a broken build is
      #                 reported early rather than after everything else passes.
      #   vitest        The unit suite, without coverage. Coverage and its
      #                 floors in vitest.config.ts are checked by hand with
      #                 `npm run audit`, not here.
      - run: npm run verify

      # The production build is inside `npm run gates`, so there is no build
      # step here, and the push gate and the local pre-push command both catch
      # a change that typechecks and tests clean but breaks the build. `gates`
      # runs `vite build` directly rather than `npm run build`, because that
      # script is `typecheck && lint && vite build` and `gates` has just run both.

  # The Docusaurus site is built and typechecked on every run of these gates:
  # e2e and update-flow both run `npm run docs:build` for the Help checks, and
  # e2e runs the site's `typecheck`, so a broken docusaurus.config.ts,
  # sidebars.ts or MDX page fails the pull request there.

  # The core end-to-end specs: the paths a broken build breaks first (the list is
  # CORE_SPECS in web/playwright.config.ts). Every pull request and push to a
  # branch other than master runs them. The full suite runs in e2e-full.yml, by hand.
  # Separate job so a Playwright failure is legible on its own and the browser
  # download does not slow the unit gate.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          # The website lock too: this job builds the docs (below), which runs
          # Docusaurus out of website/.
          cache-dependency-path: |
            web/package-lock.json
            website/package-lock.json

      - run: npm ci

      - name: Install the docs site's dependencies
        working-directory: website
        run: npm ci

      # The docs build does not typecheck, so a type error in the site's
      # config, sidebars or components builds clean without this.
      - name: Typecheck the docs site
        working-directory: website
        run: npm run typecheck

      # The accessibility scans of the Help and Safety dialogs read the docs
      # from web/public/docs, which is gitignored; without a build the frame is
      # empty and the scan checks nothing.
      - name: Build the docs the Help and Safety scans read
        run: npm run docs:build

      # Key the browser cache on the resolved Playwright version, not on the
      # lockfile hash: the browser build only changes when Playwright does.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Both projects in playwright.config.ts are Chromium. The browser restores
      # from the cache, but the system libraries `--with-deps` apt-installs do
      # not, so a cache hit still needs `install-deps`.
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run e2e:core

      # The HTML report, with the trace of every failed attempt in it, uploaded
      # when the job fails. A spec that passes on its retry leaves the job green
      # and uploads nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-core
          path: web/playwright-report/
          retention-days: 7

  update-flow:
    # The service worker, against real production builds: the update path, and
    # the runtime catalogs and the Help pages with the network off.
    #
    # Nothing else here can see any of these: the Playwright suite serves one
    # build, so it never sees a deploy, and vitest has no browser. The update check
    # proves what a deploy depends on: a tab open on the old build is offered
    # the new one and, on Reload, comes back on it, with no hard reload. The
    # offline-data check proves what a launch site depends on, in both catalog
    # layouts. With no data host the catalogs are precached and requested with
    # a `?v=<hash>` cache-buster, which Workbox does not strip when matching the
    # precache, so a wrong precache entry leaves motors, components and
    # materials unreachable offline with no error shown. With a data host, as
    # the deploy builds it, motors and components exist offline only in the
    # runtime cache, which the app writes itself on the first visit because the
    # worker does not control that page yet. Six `vite build`s (three for
    # the update flow, two for offline data, one for offline help) plus a
    # headless Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          # The website lock too: this job builds the docs (below), which runs
          # Docusaurus out of website/.
          cache-dependency-path: |
            web/package-lock.json
            website/package-lock.json

      - run: npm ci

      - name: Install the docs site's dependencies
        working-directory: website
        run: npm ci

      # offline-help (the last step) needs the built docs: the in-app Help
      # dialog reads web/public/docs, which is gitignored, and the check serves
      # a production build with those docs precached. Both locales, as the
      # deploy builds them, because the dialog can be opened in either.
      - name: Build the docs the offline-help check reads
        run: npm run docs:build

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run e2e:update

      - run: npm run e2e:offline-data

      # Help with the network off, which is the case the docs are built INTO the
      # app for: a launch site with no signal. It is the one promise the
      # precached docs make, gated beside its sibling (offline DATA).
      - run: npm run e2e:offline-help
