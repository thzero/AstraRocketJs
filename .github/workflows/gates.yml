name: Gates

# The gate set, called by BOTH ci.yml (on a PR) and deploy.yml (on merge to
# master). One definition, two callers — a reusable workflow (`workflow_call`)
# is how GitHub shares jobs, and it is the only way to avoid keeping two copies
# of this in sync by hand.
#
# Order: the engine jobs (parity, reproducible, validate) and the web jobs
# (build-and-test, e2e) run IN PARALLEL, and the PR is gated on all of them.
#
# The web jobs do not wait for parity. Every app test runs against the
# COMMITTED engine binaries in web/src/engine/vendor/ and web/public/engine/,
# so stale binaries make a green unit suite measure the wrong engine; parity's
# second step catches that by rebuilding them and failing on a diff. Both
# verdicts are required to merge, so a red parity beside a green
# build-and-test is still "do not merge", and a PR touching one .tsx file
# learns about a type error without waiting 20-60 minutes on four TeaVM
# builds. The web jobs do wait on `reproducible` and `validate`, which need no
# JDK and take seconds.
#
# Callers decide WHEN this runs; this file only says WHAT runs. It has no
# trigger of its own and cannot be run directly.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Lists the golden values a pull request moved, in the job summary, so a
  # re-record is seen where it is reviewed. Informational: it never fails.
  # Values only, so a header-only re-record reports nothing. See
  # test/parity/golden-guard.mjs.
  golden-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Golden values this pull request moved
        working-directory: engine-java
        run: node test/parity/golden-guard.mjs "${{ github.base_ref }}"

  parity:
    runs-on: ubuntu-latest
    # The Gradle daemon is disabled for CI inside parity.mjs / build-engine.mjs
    # (`--no-daemon` when process.env.CI), NOT here. It has to be on the command
    # line: GRADLE_OPTS is the LOWEST-precedence way to set org.gradle.daemon and
    # engine-java/gradle.properties (daemon=true) overrides it, so setting it
    # here leaves the daemon running and the step hangs. See the note in those
    # scripts.
    # A backstop, not a budget. This job runs four TeaVM builds - parity builds
    # and vendors JS and WASM-GC, then the committed-engine check builds both
    # targets again - plus a cold Gradle cache save. The cap has to clear all of
    # that on a cold cache with room to spare; 25 does not.
    #
    # This cap is not the hang protection: at 60 minutes it lets a stuck job
    # hold a runner for an hour. Hangs are handled where they happen:
    # `--no-daemon` for the Gradle daemon, the TeaVM targets in a killable child
    # process, and the step-level cap on the parity step.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine-java
    steps:
      - uses: actions/checkout@v7

      # 21 is the toolchain build.gradle pins. TeaVM compiles the bytecode
      # rather than running it, so the level only has to satisfy both ends.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Exact, not floating. The byte-diff step below requires the whole
          # toolchain to reproduce; a silent Temurin 21.x bump would fail an
          # unrelated PR with an unreadable binary diff.
          java-version: '21.0.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v6

      # No `npm ci` above, deliberately: engine-java/package.json declares no
      # dependencies. It exists only to name these entry points, so `npm run`
      # works here with nothing installed and CI says what the docs say.
      #
      # parity.mjs is self-contained: it builds and vendors the engine, runs
      # the VENDORED .mjs and .wasm (the files the app loads) through their
      # runParity() export, and requires bit-identical output against the JVM
      # running the same scenarios, modulo a small ULP tolerance on
      # transcendentals.
      #
      # Both targets in one step, the script's default: the JVM reference is
      # the expensive half and does not depend on the TeaVM target, so two
      # steps would compute it twice. Each target is reported on its own line
      # ("parity ok [js]" / "[wasm]"), so a divergence says which one
      # diverged. `npm run parity:js` / `:wasm` narrow it when bisecting one
      # backend.
      # STEP-level cap, deliberately much tighter than the job's. Parity's real
      # work is ~90s warm, a few minutes cold. If this step is still alive at 20
      # minutes it is stuck, not slow, and it should say so here rather than
      # being reported as a mysterious cancellation several minutes later.
      #
      # A process that has instantiated the WASM-GC module cannot exit, by any
      # route, and its event loop stops turning. So parity.mjs never loads the
      # targets into itself: test/parity/run-target.mjs runs them in a child
      # process built to be killed.
      # --expect-lines pins how MANY golden values are checked: without it,
      # dropping emissions from ParityMain and re-recording shrinks the physics
      # gate while it still reports "ok". Change it only with a reason.
      - name: Parity — JVM vs TeaVM-JS and WASM-GC
        timeout-minutes: 20
        run: npm run parity -- --expect-lines 359

      # Were the COMMITTED binaries actually built from this source?
      #
      # Parity above proves JS == WASM == JVM, all built fresh from src/java.
      # It never reads the two files the app ships, so without this step,
      # editing the Java and forgetting `build-engine.mjs` leaves CI green while
      # the app runs the old physics, and a hand-edited vendor file is equally
      # invisible.
      #
      # Rebuild over the committed artifacts and let git decide: TeaVM output is
      # byte-deterministic here (verified by building twice), so an unchanged
      # source rewrites identical bytes and `git diff` stays empty. Stale
      # binaries AND hand-edited binaries both show up as a diff.
      #
      # If this ever proves flaky across OS/JDK rather than catching a real
      # staleness, the fallback is a source+artifact SHA-256 stamp written by
      # build-engine.mjs and compared here instead — cheaper, but it cannot
      # catch a hand-edited binary.
      - name: The committed engine matches src/java
        timeout-minutes: 20
        run: |
          npm run build
          # Say WHICH failure this is before failing. The two causes look
          # identical in a binary diff and need opposite fixes: either someone
          # edited Java and did not re-run build-engine.mjs, or the rebuild was
          # genuinely not reproducible on this toolchain.
          java -version
          git diff --stat --             ../web/src/engine/vendor/openrocket-engine.mjs             ../web/public/engine/openrocket-engine.wasm             ../web/public/engine/openrocket-engine.wasm-runtime.js
          git diff --exit-code --             ../web/src/engine/vendor/openrocket-engine.mjs             ../web/public/engine/openrocket-engine.wasm             ../web/public/engine/openrocket-engine.wasm-runtime.js || {
            echo "::error::Vendored engine artifacts differ from a fresh build."
            echo "::error::If you edited engine-java/src, run 'npm run build' in engine-java/ and commit the result."
            echo "::error::If you did not, the build is not reproducible on this toolchain (see java -version above)."
            exit 1
          }

  # Can src/java still be REGENERATED from its declared inputs? Parity above
  # cannot answer that: it builds from src/java and compares the two TeaVM
  # targets, so it is blind to src/java having drifted from upstream(+patches),
  # which can leave a regeneration that does not compile.
  #
  # Needs no JDK — just node and the pinned OpenRocket source.
  reproducible:
    runs-on: ubuntu-latest
    # 15 minutes, against the 360-minute default. The cap is for a HANG, not
    # for slowness: a Playwright locator waiting on an element that never
    # appears, a kernel build deadlocking, a fetch with no timeout of its own.
    # Uncapped, those burn runner minutes for six hours with the PR showing
    # "in progress".
    #
    # 15 and not 10 because `build-and-test` (npm ci plus `verify:ci`) runs close
    # to 8 minutes. A cap sized just over the work fails on runner load, which a
    # shared runner has.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The ref lives in engine-java/extract/UPSTREAM and is READ from there,
      # not copied here. Two copies with nothing comparing them drift: bump one
      # and forget the other, and either CI checks the wrong tree and blames
      # ~200 files of "drift", or CI goes green while UPSTREAM lies and every
      # local `extract:check` reports phantom drift.
      - name: Read the pinned OpenRocket ref
        id: upstream
        run: |
          sed -n 's/^repo[[:space:]]*=[[:space:]]*//p' engine-java/extract/UPSTREAM \
            | sed 's#https://github.com/##; s#\.git$##' \
            | xargs -I{} echo "repo={}" >> "$GITHUB_OUTPUT"
          sed -n 's/^ref[[:space:]]*=[[:space:]]*//p' engine-java/extract/UPSTREAM \
            | xargs -I{} echo "ref={}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Check out the pinned OpenRocket source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.upstream.outputs.repo }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: .openrocket-src
          sparse-checkout: core/src/main/java
          sparse-checkout-cone-mode: false

      # `date` in UPSTREAM is what the app's About dialog and the docs Overview
      # page tell a reader the engine was built from, so it has to BE the
      # commit's date and not whatever was true the last time someone typed it.
      # The pinned tree is already checked out here, so asking git costs
      # nothing. Author and committer date both count: a rebased or
      # cherry-picked upstream commit carries two, and either is a fair answer
      # to "when is this from".
      - name: The pinned date is the pinned commit's date
        run: |
          want=$(sed -n 's/^date[[:space:]]*=[[:space:]]*//p' engine-java/extract/UPSTREAM)
          if [ -z "$want" ]; then
            echo '::error::engine-java/extract/UPSTREAM has no date line.'
            exit 1
          fi
          cd .openrocket-src
          authored=$(TZ=UTC git log -1 --format=%ad --date=format-local:%Y-%m-%d)
          committed=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          if [ "$want" != "$authored" ] && [ "$want" != "$committed" ]; then
            echo "::error::UPSTREAM says date = $want, but the pinned commit is authored $authored / committed $committed. Bump date with ref."
            exit 1
          fi
          echo "date = $want matches the pinned commit."

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Extraction is reproducible
        working-directory: engine-java
        run: npm run extract:check -- --src "$GITHUB_WORKSPACE/.openrocket-src"

  # The aero scorecard, as a RATCHET.
  #
  # This harness scores the engine against published wind-tunnel anchors. It
  # cannot be a pass/fail gate, because the honest current score is 9/135 on the
  # classic model - so it gates on two things that ARE meaningful:
  #
  #   --min           the score must not drop below the recorded floor
  #   --expect-gates  the anchor SET must not silently shrink, which is the
  #                   other way this fails open (the denominator just gets
  #                   smaller and the scorecard still reads normally)
  #   --expect-gate-hash  nor change identity at the same size: a sha256 over
  #                   every gated point's series, Mach, anchor and tolerance, so
  #                   widening a tolerance or swapping hard points for easy ones
  #                   fails too. The scorecard prints the current hash.
  #
  # Each fixture also pins its own drag, CNa and CP (`_expect.aero`), so a
  # fixture that stops modeling its rocket fails before it is scored.
  #
  # All three numbers (floors, gate count, gate hash) live in
  # engine-java/validation/floors.json, read by --check-floors; nothing here
  # repeats them. Raise the floors when the model improves; that is the point of
  # a ratchet.
  # Needs no JDK and no build - it imports the committed vendored engine - so
  # the whole job is a few seconds.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # see `reproducible` for why 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Aero scorecard, classic Extended Barrowman (flags off)
        working-directory: engine-java
        run: node validation/score.mjs --check-floors

      - name: Aero scorecard, opt-in supersonic path
        working-directory: engine-java
        run: node validation/score.mjs --supersonic --check-floors

  # Not gated on parity: see the ordering note at the top of this file.
  build-and-test:
    needs: [reproducible, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15 # see `reproducible` for why 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # ONE list, `gates` in web/package.json, run here and locally and by
      # dev.yml, so the gates cannot drift between them. `verify` and
      # `verify:ci` are two endings on it: a gate added to `verify` alone is
      # not run by CI. Spelling the steps out here instead lets the hand-run
      # list drift from this one. What the list holds, and why each is there:
      #
      #   format:check  Formatting. `.gitattributes` pins LF, without which a
      #                 CRLF checkout fails `--check` on every tracked file, and
      #                 `.prettierignore` excludes the generated artifacts
      #                 (public/docs, the TeaVM output, the synced catalogs),
      #                 leaving only authored code.
      #   spell         US English, enforced. cspell's en-US dictionary catches
      #                 a British spelling, and cspell.json's flagWords make the
      #                 common ones (the -our, -re and -ise forms) forbidden
      #                 outright, so no project-words entry can let one in.
      #   typecheck     All three tsconfig projects: src and tests, e2e, and the
      #                 build config files (tsconfig.node.json).
      #   lint          ESLint, warnings included.
      #   knip          Dead exports / unimported modules. Cheap, and it only
      #                 stays useful if something runs it.
      #   vite build    The production build. Before the suite on purpose: it is
      #                 ~20 s against the suite's ~5 min, so a broken build is
      #                 reported early rather than after everything else passes.
      #   vitest        The unit suite. `verify:ci` runs it with coverage and
      #                 enforces the floors in vitest.config.ts; `verify` runs it
      #                 without, because instrumentation is 65 s against 335 s and
      #                 that belongs on a runner rather than in the inner loop.
      #
      # `verify:ci`, which is `gates` plus the suite WITH coverage. `verify` is the
      # same `gates` plus the suite without it: ONE shared list, two endings, so the
      # gate set still cannot drift between here and a developer's machine while the
      # 270 s of coverage instrumentation stays off the command a human types.
      - run: npm run verify:ci

      # `text-summary` scrolls past in the log and `lcov` is written to a disk
      # that is thrown away with the runner. The totals go on the run's summary
      # page, where they are read without opening a log, and the per-line lcov
      # is kept a week for whoever wants to look at a specific file.
      - name: Coverage totals to the job summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage-summary.json: the suite did not finish (vitest writes nothing on failure)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Coverage"
            echo ""
            echo "| | Covered | Total | % |"
            echo "| --- | ---: | ---: | ---: |"
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              for (const k of ["lines", "statements", "functions", "branches"]) {
                const v = t[k];
                console.log(`| ${k} | ${v.covered} | ${v.total} | ${v.pct}% |`);
              }
            '
            echo ""
            echo "Floor: lines >= 70% (vitest.config.ts). lcov.info is in the run artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: web/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      # The production build is inside `npm run gates`, so there is no build
      # step here, and the push gate and the local pre-push command both catch
      # a change that typechecks and tests clean but breaks the build. `gates`
      # runs `vite build` directly rather than `npm run build`, because that
      # script is `typecheck && lint && vite build` and `gates` has just run both.

  # NOTE: the Docusaurus site is NOT built here. It is gated in deploy.yml
  # on merge to master, where it is built into web/public/docs anyway. The
  # trade-off is deliberate and it is real: a broken docusaurus.config.ts,
  # sidebars.ts or MDX page is not caught before merge, so it surfaces as
  # a RED MASTER DEPLOY rather than a red PR check, and the fix goes forward on
  # master. Accepted because docs breakage does not ship bad physics or a broken
  # app, and a PR touching only web/ would pay a full `npm ci` + Docusaurus build for
  # a risk it could not introduce.

  # The core end-to-end specs: the paths a broken build breaks first (the list is
  # CORE_SPECS in web/playwright.config.ts). Every pull request and master push
  # runs them. The full suite runs in e2e-full.yml, by hand.
  # Separate job so a Playwright failure is legible on its own and the browser
  # download does not slow the unit gate.
  e2e:
    # Not gated on parity either: the ordering note at the top of this file.
    needs: [reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Key the browser cache on the resolved Playwright version, not on the
      # lockfile hash: the browser build only changes when Playwright does.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Both projects in playwright.config.ts are Chromium. The browser restores
      # from the cache, but the system libraries `--with-deps` apt-installs do
      # not, so a cache hit still needs `install-deps`.
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run e2e:core

      # The HTML report, with the trace of any retried spec in it. A spec that
      # failed and then passed on its retry is a flake, and the report is the
      # only place that says so: the job is green.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-core
          path: web/playwright-report/
          retention-days: 7

  update-flow:
    # The service worker, against real production builds: the update path, and
    # the runtime catalogs with the network off.
    #
    # Nothing else here can see either: the Playwright suite serves one build,
    # so it never sees a deploy, and vitest has no browser. The update check
    # proves what a deploy depends on: a tab open on the old build is offered
    # the new one and, on Reload, comes back on it, with no hard reload. The
    # offline check proves what a launch site depends on: the catalogs are
    # requested with a `?v=<hash>` cache-buster, which Workbox does not strip
    # when matching the precache, so a wrong precache entry leaves motors,
    # components and materials unreachable offline with no error shown. Three
    # `vite build`s plus a headless Chromium, about three minutes.
    needs: [reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # The website lock too: this job builds the docs (below), which runs
          # Docusaurus out of website/.
          cache-dependency-path: |
            web/package-lock.json
            website/package-lock.json

      - run: npm ci


      - name: Install the docs site's dependencies
        working-directory: website
        run: npm ci

      # offline-help (the last step) needs the built docs: the in-app Help
      # dialog reads web/public/docs, which is gitignored, and the check serves
      # a production build with those docs precached. Both locales, as the
      # deploy builds them, because the dialog can be opened in either.
      - name: Build the docs offline-help checks
        run: npm run docs:build

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run e2e:update

      - run: npm run e2e:offline-data

      # Help with the network off, which is the case the docs are built INTO the
      # app for: a launch site with no signal. It is the one promise the
      # precached docs make, gated beside its sibling (offline DATA).
      - run: npm run e2e:offline-help
