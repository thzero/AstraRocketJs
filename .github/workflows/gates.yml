name: Gates

# The gate set, called by BOTH ci.yml (on a PR) and deploy.yml (on merge to
# master). One definition, two callers — a reusable workflow (`workflow_call`)
# is how GitHub shares jobs, and it is the only way to avoid keeping two copies
# of this in sync by hand.
#
# Order: the engine jobs (parity, reproducible, validate) and the web jobs
# (build-and-test, e2e) run IN PARALLEL, and the PR is gated on all of them.
#
# The web jobs used to wait for parity. The reasoning was that every app test
# runs against the COMMITTED engine binaries in web/src/engine/vendor/ and
# web/public/engine/, so if those are stale, a green unit suite is measuring
# the wrong engine. That is still true, and it is still caught: parity's
# second step rebuilds the committed binaries and fails on a diff. What the
# ordering bought was only that the web verdict was never SHOWN before the
# engine verdict, and it cost 20-60 minutes of parity in front of a 2-minute
# job, so a PR touching one .tsx file waited on four TeaVM builds to learn it
# had a type error. Both verdicts are required either way; a red parity beside
# a green build-and-test is the same "do not merge" as before, one hour
# sooner. The web jobs still wait on `reproducible` and `validate`, which need
# no JDK and are seconds, not minutes.
#
# Callers decide WHEN this runs; this file only says WHAT runs. It has no
# trigger of its own and cannot be run directly.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    # The Gradle daemon is disabled for CI inside parity.mjs / build-engine.mjs
    # (`--no-daemon` when process.env.CI), NOT here. It has to be on the command
    # line: GRADLE_OPTS is the LOWEST-precedence way to set org.gradle.daemon and
    # engine-java/gradle.properties (daemon=true) overrides it. Setting it here
    # was tried and the step still hung. See the note in those scripts.
    # A backstop, not a budget. This job still runs four TeaVM builds - parity
    # builds -Pparity for JS and for WASM-GC, then the committed-engine check
    # builds both targets again - plus a cold Gradle cache save. It no longer
    # runs the JVM reference twice (see the parity step below). The cap has to
    # clear all of that on a cold cache with room to spare; 25 did not, and
    # canceled a job that was working.
    #
    # This cap is NOT the hang protection it once claimed to be, and it never
    # was: at 60 minutes it would let a passing check hold a runner for an hour.
    # The hangs were fixed where they happened - `--no-daemon` for the Gradle
    # daemon, and, for the one that survived that, moving the TeaVM targets out
    # of parity.mjs into a killable child. The cap is only a backstop against
    # something new.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine-java
    steps:
      - uses: actions/checkout@v7

      # 21 is the toolchain build.gradle pins. TeaVM compiles the bytecode
      # rather than running it, so the level only has to satisfy both ends.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Exact, not floating. The byte-diff step below requires the whole
          # toolchain to reproduce; a silent Temurin 21.x bump would fail an
          # unrelated PR with an unreadable binary diff.
          java-version: '21.0.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v6

      # No `npm ci` above, deliberately: engine-java/package.json declares no
      # dependencies. It exists only to name these entry points, so `npm run`
      # works here with nothing installed and CI says what the docs say.
      #
      # parity.mjs is self-contained: it builds the parity engine variant
      # (-Pparity) and the JVM reference itself, then requires bit-identical
      # output modulo a small ULP tolerance on transcendentals.
      #
      # Both targets in one step, which is now the script's default: the JVM
      # reference is the expensive half and does not depend on the TeaVM target.
      # As two steps this computed the identical reference twice and threw one
      # away: measured warm, the two separate runs were 19s + 11s against 10s
      # for the single run. Each target is still reported on its own line
      # ("parity ok [js]" / "[wasm]"), so a divergence still says which one
      # diverged. `npm run parity:js` / `:wasm` narrow it when bisecting one
      # backend.
      # STEP-level cap, deliberately much tighter than the job's. Parity's real
      # work is ~90s warm, a few minutes cold. If this step is still alive at 20
      # minutes it is stuck, not slow, and it should say so here rather than
      # being reported as a mysterious cancellation several minutes later.
      #
      # This step was instrumented for one run to settle the hang that four
      # guesses had failed to explain. It answered the narrow question - run
      # 35267658288 printed every verdict, never reached the `echo` placed
      # immediately after `node`, and left one orphan: `node`, not `java` - so
      # the instrumentation is gone again.
      #
      # The cause was then MEASURED, on Ubuntu 26.04 / node 22.23.2 rather than
      # guessed at from a log: a process that has instantiated the WASM-GC
      # module can no longer exit, by any route, and its event loop stops
      # turning. parity.mjs used to load the targets into itself. It no longer
      # does; test/parity/run-target.mjs carries that in a process built to be
      # killed. Nothing in this file had to change for it.
      - name: Parity — JVM vs TeaVM-JS and WASM-GC
        timeout-minutes: 20
        run: npm run parity

      # Were the COMMITTED binaries actually built from this source?
      #
      # Parity above proves JS == WASM == JVM, all built fresh from src/java —
      # it never reads the two files the app ships, so editing the Java and
      # forgetting `build-engine.mjs` left CI green while the app ran the old
      # physics. Hand-editing a vendor file was equally invisible.
      #
      # Rebuild over the committed artifacts and let git decide: TeaVM output is
      # byte-deterministic here (verified by building twice), so an unchanged
      # source rewrites identical bytes and `git diff` stays empty. Stale
      # binaries AND hand-edited binaries both show up as a diff.
      #
      # If this ever proves flaky across OS/JDK rather than catching a real
      # staleness, the fallback is a source+artifact SHA-256 stamp written by
      # build-engine.mjs and compared here instead — cheaper, but it cannot
      # catch a hand-edited binary.
      - name: The committed engine matches src/java
        timeout-minutes: 20
        run: |
          npm run build
          # Say WHICH failure this is before failing. The two causes look
          # identical in a binary diff and need opposite fixes: either someone
          # edited Java and did not re-run build-engine.mjs, or the rebuild was
          # genuinely not reproducible on this toolchain.
          java -version
          git diff --stat --             ../web/src/engine/vendor/openrocket-engine.mjs             ../web/public/engine/openrocket-engine.wasm             ../web/public/engine/openrocket-engine.wasm-runtime.js
          git diff --exit-code --             ../web/src/engine/vendor/openrocket-engine.mjs             ../web/public/engine/openrocket-engine.wasm             ../web/public/engine/openrocket-engine.wasm-runtime.js || {
            echo "::error::Vendored engine artifacts differ from a fresh build."
            echo "::error::If you edited engine-java/src, run 'npm run build' in engine-java/ and commit the result."
            echo "::error::If you did not, the build is not reproducible on this toolchain (see java -version above)."
            exit 1
          }

  # Can src/java still be REGENERATED from its declared inputs? Parity above
  # cannot answer that — it builds from src/java and compares the two TeaVM
  # targets, so it is blind to src/java having drifted from upstream(+patches).
  # It had: a regeneration produced a tree that did not compile, and the one
  # tool that checks could not fail (its exit code ignored drift entirely).
  #
  # Needs no JDK — just node and the pinned OpenRocket source.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The ref lives in engine-java/extract/UPSTREAM and is READ from there,
      # not copied here. It used to be written out in both places with nothing
      # comparing them: bump one and forget the other, and either CI checks the
      # wrong tree and blames ~200 files of "drift", or CI goes green while
      # UPSTREAM lies and every local `extract:check` reports phantom drift.
      # They agreed only because someone repinned both by hand.
      - name: Read the pinned OpenRocket ref
        id: upstream
        run: |
          sed -n 's/^repo[[:space:]]*=[[:space:]]*//p' engine-java/extract/UPSTREAM \
            | sed 's#https://github.com/##; s#\.git$##' \
            | xargs -I{} echo "repo={}" >> "$GITHUB_OUTPUT"
          sed -n 's/^ref[[:space:]]*=[[:space:]]*//p' engine-java/extract/UPSTREAM \
            | xargs -I{} echo "ref={}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Check out the pinned OpenRocket source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.upstream.outputs.repo }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: .openrocket-src
          sparse-checkout: core/src/main/java
          sparse-checkout-cone-mode: false

      # `date` in UPSTREAM is what the app's About dialog and the docs Overview
      # page tell a reader the engine was built from, so it has to BE the
      # commit's date and not whatever was true the last time someone typed it.
      # The pinned tree is already checked out here, so asking git costs
      # nothing. Author and committer date both count: a rebased or
      # cherry-picked upstream commit carries two, and either is a fair answer
      # to "when is this from".
      - name: The pinned date is the pinned commit's date
        run: |
          want=$(sed -n 's/^date[[:space:]]*=[[:space:]]*//p' engine-java/extract/UPSTREAM)
          if [ -z "$want" ]; then
            echo '::error::engine-java/extract/UPSTREAM has no date line.'
            exit 1
          fi
          cd .openrocket-src
          authored=$(TZ=UTC git log -1 --format=%ad --date=format-local:%Y-%m-%d)
          committed=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          if [ "$want" != "$authored" ] && [ "$want" != "$committed" ]; then
            echo "::error::UPSTREAM says date = $want, but the pinned commit is authored $authored / committed $committed. Bump date with ref."
            exit 1
          fi
          echo "date = $want matches the pinned commit."

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Extraction is reproducible
        working-directory: engine-java
        run: npm run extract:check -- --src "$GITHUB_WORKSPACE/.openrocket-src"

  # The aero scorecard, as a RATCHET.
  #
  # This harness existed and scored the engine against published wind-tunnel
  # anchors, and nothing ever ran it: a gate that has already failed open. It
  # cannot be a pass/fail gate, because the honest current score is 9/135 on the
  # classic model - so it gates on two things that ARE meaningful:
  #
  #   --min           the score must not drop below the recorded floor
  #   --expect-gates  the anchor SET must not silently shrink, which is the
  #                   other way this fails open (the denominator just gets
  #                   smaller and the scorecard still reads normally)
  #
  # Raise the floors when the model improves; that is the point of a ratchet.
  # Needs no JDK and no build - it imports the committed vendored engine - so
  # the whole job is a few seconds.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Aero scorecard, classic Extended Barrowman (flags off)
        working-directory: engine-java
        run: node validation/score.mjs --expect-gates 135 --min 9

      - name: Aero scorecard, opt-in supersonic path
        working-directory: engine-java
        run: node validation/score.mjs --supersonic --expect-gates 135 --min 61

  # Not gated on parity: see the ordering note at the top of this file.
  build-and-test:
    needs: [reproducible, validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # ONE list, `verify` in web/package.json, run here and locally and by
      # dev.yml, so the gates cannot drift between them. This job used to spell
      # the steps out, and it is what was run by hand that drifted: typecheck
      # and lint were only reached through `npm run build`, and knip was easy
      # to forget. What the list holds, and why each is there:
      #
      #   format:check  Formatting, gated at last. It could not be turned on
      #                 before: with no .gitattributes, a CRLF checkout failed
      #                 `--check` on every tracked file, so the signal was 100%
      #                 noise. `.gitattributes` pins LF and `.prettierignore`
      #                 excludes the generated artifacts (public/docs, the TeaVM
      #                 output, the synced catalogs), leaving only authored code.
      #   spell         US English, enforced. The tree had ~380 British spellings
      #                 before this ran; cspell's en-US dictionary catches a new
      #                 one, and cspell.json's flagWords make the common ones
      #                 (the -our, -re and -ise forms) forbidden outright, so no
      #                 project-words entry can quietly let one back in.
      #   typecheck     All three tsconfig projects: src, e2e and the config files.
      #   lint          ESLint, warnings included.
      #   knip          Dead exports / unimported modules. Cheap, and it only
      #                 stays useful if something runs it.
      #   vitest run    The unit suite.
      #
      # The ONE difference from a local `npm run verify`: `-- --coverage` lands
      # on the final `vitest run`, so here the suite also collects coverage and
      # enforces the floor in vitest.config.ts. Locally the same is
      # `npm run test:coverage`.
      - run: npm run verify -- --coverage

      # Coverage used to be emitted and seen by nobody: `text-summary` scrolled
      # past in the log and `lcov` was written to a disk that was thrown away
      # with the runner. The totals go on the run's summary page, where they
      # are read without opening a log, and the per-line lcov is kept a week
      # for whoever wants to look at a specific file.
      - name: Coverage totals to the job summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage-summary.json: the suite did not finish (vitest writes nothing on failure)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Coverage"
            echo ""
            echo "| | Covered | Total | % |"
            echo "| --- | ---: | ---: | ---: |"
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              for (const k of ["lines", "statements", "functions", "branches"]) {
                const v = t[k];
                console.log(`| ${k} | ${v.covered} | ${v.total} | ${v.pct}% |`);
              }
            '
            echo ""
            echo "Floor: lines >= 55% (vitest.config.ts). lcov.info is in the run artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: web/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      # `vite build` directly, not `npm run build`: that script is
      # `typecheck && lint && vite build`, and verify above has just run both.
      # Running them again cost ~40 s for no new information.
      - run: npx vite build

  # NOTE: the Docusaurus site is NOT built here. It is gated in deploy.yml
  # on merge to master, where it is built into web/public/docs anyway. The
  # trade-off is deliberate and it is real: a broken docusaurus.config.ts,
  # sidebars.ts or MDX page is no longer caught before merge, so it surfaces as
  # a RED MASTER DEPLOY rather than a red PR check, and the fix goes forward on
  # master. Accepted because docs breakage does not ship bad physics or a broken
  # app, and a PR touching only web/ paid a full `npm ci` + Docusaurus build for
  # a risk it could not introduce.

  # The integration layer: schematic, motor picker, recovery, mobile layout, the
  # aero tables. It was previously run only when someone remembered to, which is
  # how a shipped dialog reached master with an unbounded render loop in it.
  # Separate job so a Playwright failure is legible on its own and the browser
  # download does not slow the unit gate.
  e2e:
    # Not gated on parity either: the ordering note at the top of this file.
    needs: [reproducible]
    runs-on: ubuntu-latest
    # Sharded because the suite is ~3.6 min of WALL CLOCK that no amount of
    # caching touches — the browser download the cache below removes is ~90s of
    # a ~4.4 min job, and the tests are the rest.
    #
    # Sharding rather than raising `workers`: playwright.config.ts pins
    # `workers: 1` on purpose (16 workers against ONE dev server, each
    # software-rendering WebGL and loading the 2.9 MB WASM engine, gave 45 then
    # 19 spurious failures and was SLOWER — 4.4 min vs 3.6). Each shard is its
    # own runner with its own dev server and its own single worker, so that
    # reasoning still holds and the contention never happens.
    #
    # Three ways: 146 tests over 29 files (the desktop project runs every
    # spec, the Pixel 7 project re-runs the three phone-layout ones), so ~50
    # tests a shard. Each shard pays its own ~50s of npm ci + browser restore +
    # dev-server start, so the returns flatten fast past this — four would buy
    # ~20s more for another runner's worth of minutes.
    strategy:
      # One shard failing must not cancel the others, or the first red shard
      # hides every other failure and you find them one push at a time.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Key the browser cache on the resolved Playwright version, not on the
      # lockfile hash: the browser build only changes when Playwright does, so
      # hashing the lockfile would throw away a good 130 MB download on every
      # unrelated dependency bump.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Chromium only: both projects in playwright.config.ts (desktop and the
      # Pixel 7 emulation) are Chromium, and the config already starts the dev
      # server and sets retries/reporter under CI.
      #
      # Split on the cache: the browser itself lives in ~/.cache/ms-playwright
      # and restores, but `--with-deps` also apt-installs system libraries that
      # do NOT, so a cache hit still needs `install-deps` on its own.
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The HTML report, with the trace of any retried spec in it. It is only
      # written because playwright.config.ts adds the `html` reporter under CI
      # beside `github`; with `github` alone this directory did not exist and
      # the upload silently had nothing to upload. A spec that failed and then
      # passed on its retry is a flake, and the report is the only place that
      # says so: the job is green.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          # Artifact names must be unique across a matrix, or the shards
          # collide and only one report survives.
          name: playwright-report-shard-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7

  update-flow:
    # The service-worker update path, against two real production builds.
    #
    # Nothing else here can see it: the dev server the Playwright suite runs
    # against registers no worker, and vitest has no browser. What this proves
    # is the thing a deploy depends on: a tab open on the old build is offered
    # the new one and, on Reload, comes back on it, with no hard reload. Two
    # `vite build`s plus a headless Chromium, about two minutes.
    needs: [reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run e2e:update
