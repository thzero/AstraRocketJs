name: Gates

# The gate set, called by ci.yml (on a PR) and dev.yml (on a push to any other
# branch). One definition, two callers: a
# reusable workflow (`workflow_call`) is how GitHub shares jobs, and it is the
# only way to avoid keeping copies of this in sync by hand.
#
# The web jobs (build-and-test, unit, e2e) run in parallel, and the PR is
# gated on all of them. Each is split three ways, each slice on its own runner,
# so the wait is one slice, not the whole job. The service worker checks (update-flow) run by hand in e2e-full.yml. The engine checks (parity, the reproducible extract,
# the aero scorecards) are not here: they only move when the engine changes,
# and are run by hand with `npm run audit` in engine-java.
#
# Callers decide WHEN this runs; this file only says WHAT runs. It has no
# trigger of its own and cannot be run directly.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A cap sized just over the work fails on runner load, which a shared
    # runner has.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The three parts of `build` in web/package.json, one runner each.
        check: [npm run typecheck, npm run lint, npx vite build]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # node_modules from the cache; `npm ci` only when the lockfile changed.
      - id: web-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: web-modules-${{ runner.os }}-node24-${{ hashFiles('web/package-lock.json') }}

      - if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      # The three parts of `npm run build`, one per runner. `verify` runs the same
      # three locally and adds the unit suite, which is the unit job below:
      #
      #   typecheck     All four tsconfig projects: src and tests, the app,
      #                 e2e, and the build config files (tsconfig.node.json).
      #   lint          ESLint, warnings included.
      #   vite build    The production build.
      #
      # Formatting, spelling, knip and jscpd are housekeeping and run in `npm run audit`.
      - run: ${{ matrix.check }}

  # The unit suite, without coverage, in three slices on three runners.
  # Coverage and its floors in vitest.config.ts are checked by hand with
  # `npm run audit`, not here.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One slice failing must not cancel the others, or the first red slice
      # hides the rest of the failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # node_modules from the cache; `npm ci` only when the lockfile changed.
      - id: web-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: web-modules-${{ runner.os }}-node24-${{ hashFiles('web/package-lock.json') }}

      - if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # The core end-to-end specs: the paths a broken build breaks first (the list is
  # CORE_SPECS in web/playwright.config.ts). Every pull request and push to a
  # branch other than master and beta runs them. The full suite runs in e2e-full.yml, by hand.
  # Separate job so a Playwright failure is legible on its own and the browser
  # download does not slow the unit gate.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Chromium and the system libraries it needs come baked into the image, so
    # the job installs nothing. The tag must match the @playwright/test version
    # in web/package-lock.json; the first step fails when they differ.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # node_modules from the cache; `npm ci` only when the lockfile changed.
      - id: web-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: web-modules-${{ runner.os }}-node24-${{ hashFiles('web/package-lock.json') }}

      - if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check the image matches Playwright
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          [ "$v" = "1.63.0" ] || { echo "::error::@playwright/test is $v; update the container image tag in gates.yml"; exit 1; }

      - run: npm run e2e:core -- --shard=${{ matrix.shard }}/3

      # The HTML report, with the trace of every failed attempt in it, uploaded
      # when the job fails. A spec that passes on its retry leaves the job green
      # and uploads nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-core-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7
