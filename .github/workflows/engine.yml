name: Engine

# The physics kernel ships as two committed binaries built from one Java source:
#   web/src/engine/vendor/openrocket-engine.mjs   (TeaVM JS)
#   web/public/engine/openrocket-engine.wasm      (TeaVM WASM-GC)
#
# `engine-java/test/parity/parity.mjs` exists to prove JVM ≡ TeaVM-JS ≡ WASM-GC,
# and until now nothing ran it — so a change regenerated into one target and not
# the other, or a hand-edited vendor file, could ship silently divergent physics.
#
# Only on changes that can move a number: the Java sources, the build, or the
# vendored outputs. The web app's own gates live in ci.yml.
#
# Both triggers, de-duplicated by the `guard` job — see the long note in ci.yml.
# This is the workflow where the double run hurt most: a push to a branch with
# an open PR ran the whole TeaVM toolchain twice over, for JS and for WASM-GC,
# on the same commit.
on:
  pull_request:
    paths:
      - 'engine-java/**'
      - 'web/src/engine/vendor/**'
      - 'web/public/engine/**'
      - '.github/workflows/engine.yml'
  push:
    branches-ignore: [master]
    paths:
      - 'engine-java/**'
      - 'web/src/engine/vendor/**'
      - 'web/public/engine/**'
      - '.github/workflows/engine.yml'

permissions:
  contents: read
  # The guard job below reads whether an open PR covers the pushed commit.
  pull-requests: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is this commit already covered by an open PR? On a `pull_request` event the
  # answer is always "run". On a `push`, we ask the API: if an open PR contains
  # this SHA, its own run is about to do the identical work, so skip.
  #
  # Cheap (one API call, no checkout) and it fails OPEN: any error, and `run`
  # stays true, so a broken guard over-tests rather than silently gating
  # nothing.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "pull_request event - running."
            exit 0
          fi
          open=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                   --jq '[.[] | select(.state == "open")] | length' 2>/dev/null) || open=""
          if [ "$open" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "push with no open PR - running."
          elif [ -z "$open" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "could not reach the API - running anyway."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$open open PR(s) already cover this commit - skipping."
          fi

  parity:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A hung step would otherwise hold a runner for the 6-hour default. The two
    # parity runs together are ~8 min cold, so 25 fails fast and still leaves
    # room for a slow TeaVM compile.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine-java
    steps:
      - uses: actions/checkout@v4

      # 21 is the toolchain build.gradle pins. TeaVM compiles the bytecode
      # rather than running it, so the level only has to satisfy both ends.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      # parity.mjs is self-contained: it builds the parity engine variant
      # (-Pparity) and the JVM reference itself, then requires bit-identical
      # output modulo a small ULP tolerance on transcendentals.
      - name: Parity — JVM vs TeaVM-JS
        run: node test/parity/parity.mjs

      - name: Parity — JVM vs WASM-GC
        run: node test/parity/parity.mjs --wasm

      # Were the COMMITTED binaries actually built from this source?
      #
      # Parity above proves JS == WASM == JVM, all built fresh from src/java —
      # it never reads the two files the app ships, so editing the Java and
      # forgetting `build-engine.mjs` left CI green while the app ran the old
      # physics. Hand-editing a vendor file was equally invisible.
      #
      # Rebuild over the committed artifacts and let git decide: TeaVM output is
      # byte-deterministic here (verified by building twice), so an unchanged
      # source rewrites identical bytes and `git diff` stays empty. Stale
      # binaries AND hand-edited binaries both show up as a diff.
      #
      # If this ever proves flaky across OS/JDK rather than catching a real
      # staleness, the fallback is a source+artifact SHA-256 stamp written by
      # build-engine.mjs and compared here instead — cheaper, but it cannot
      # catch a hand-edited binary.
      - name: The committed engine matches src/java
        run: |
          node build-engine.mjs
          node build-engine.mjs --wasm
          git diff --exit-code --             ../web/src/engine/vendor/openrocket-engine.mjs             ../web/public/engine/openrocket-engine.wasm             ../web/public/engine/openrocket-engine.wasm-runtime.js

  # Can src/java still be REGENERATED from its declared inputs? Parity above
  # cannot answer that — it builds from src/java and compares the two TeaVM
  # targets, so it is blind to src/java having drifted from upstream(+patches).
  # It had: a regeneration produced a tree that did not compile, and the one
  # tool that checks could not fail (its exit code ignored drift entirely).
  #
  # Needs no JDK — just node and the pinned OpenRocket source.
  reproducible:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned in engine-java/extract/UPSTREAM. --check is only meaningful
      # against the exact tree the extraction was made from; a floating ref
      # would report every upstream commit as drift.
      - name: Check out the pinned OpenRocket source
        uses: actions/checkout@v4
        with:
          repository: thzero/openrocket
          ref: c1a1a9b9fff2d629a5a64dc30dfd0603dfef62c3
          path: .openrocket-src
          sparse-checkout: core/src/main/java
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extraction is reproducible
        working-directory: engine-java
        run: node extract/extract.mjs --check --src "$GITHUB_WORKSPACE/.openrocket-src"
