name: Deploy to GitHub Pages

# Builds the web/ app and publishes web/dist to GitHub Pages.
# ONE-TIME SETUP: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege token for the deploy; allow one concurrent Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Gate the publish on the unit tests — a red test blocks the deploy.
      - run: npm run test

      # Refresh the About dialog's contributor list from the GitHub API so a newly
      # merged contributor is credited on the next deploy without a manual commit.
      # Best-effort: if the API is down or throttled the step is skipped and the
      # build uses the committed src/data/contributors.generated.json instead.
      - run: npm run sync:contributors
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Serve from https://<user>.github.io/<repo>/ — base must be /<repo>/.
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
