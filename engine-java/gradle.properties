# Build performance. There was no gradle.properties at all, so every one of
# these was at its default-off value — and the parity CI job invokes Gradle SIX
# times (generateJavaScript, parityJvm, buildWasmGC, parityJvm again, then
# build-engine.mjs for each of the two targets), every one of them recompiling
# from scratch.

# The build cache. Off by default, which is why the repeated compiles in that
# job shared nothing. `gradle/actions/setup-gradle` already persists the cache
# directory between CI runs, so this also makes a COLD run reuse the previous
# run's outputs — it just had nothing to reuse while this was unset.
org.gradle.caching=true

# Independent tasks run concurrently. The runner has 4 cores and the build was
# using one.
org.gradle.parallel=true

# Skip configuration on a rerun whose build scripts and inputs are unchanged.
# Six invocations per job means six configuration phases, and only the first
# has to do the work.
org.gradle.configuration-cache=true

# The daemon survives between the six invocations within one job, so the JIT
# stays warm instead of starting cold each time.
org.gradle.daemon=true

# TeaVM's whole-program optimizer is the memory-hungry step here; the default
# heap makes it GC-thrash. 2 GB is well inside the 16 GB an ubuntu-latest runner
# has, and inside a typical dev machine.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
