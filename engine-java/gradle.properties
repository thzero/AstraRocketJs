# Build performance. One engine audit (audit.mjs) invokes Gradle several times
# (parity builds both TeaVM targets and runs the JVM reference, then the
# `committed` step builds both targets again), and with these at their
# default-off values every invocation compiles from scratch.

# The build cache, so the repeated compiles share their outputs.
org.gradle.caching=true

# Independent tasks run concurrently.
org.gradle.parallel=true

# Skip configuration on a rerun whose build scripts and inputs are unchanged.
# Several invocations per audit means several configuration phases, and only
# the first has to do the work.
org.gradle.configuration-cache=true

# The daemon survives between invocations, so the JIT stays warm instead of
# starting cold each time.
org.gradle.daemon=true

# TeaVM's whole-program optimizer is the memory-hungry step here; the default
# heap makes it GC-thrash. 2 GB is well inside a typical dev machine.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
